name: Immutable v0.45.0 release transport

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful main GitHub Actions run that produced the source artifact
        required: true
        type: string
      source_artifact_id:
        description: Exact artifact ID from the successful main run
        required: true
        type: string
      source_commit_sha:
        description: Main commit checked by the source run
        required: true
        type: string
      release_tag:
        description: New immutable release tag
        required: true
        default: v0.45.0
        type: string

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
      SOURCE_COMMIT_SHA: ${{ inputs.source_commit_sha }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - name: Check out the source commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_commit_sha }}
          fetch-depth: 1

      - name: Resolve and verify the successful main artifact
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RELEASE_TAG" = "v0.45.0"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT_SHA"
          main_sha=$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')
          test "$main_sha" = "$SOURCE_COMMIT_SHA"
          run_json=$(gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID")
          jq -e --arg sha "$SOURCE_COMMIT_SHA" --arg run_id "$SOURCE_RUN_ID" '.id==($run_id|tonumber) and .event=="push" and .head_branch=="main" and .head_sha==$sha and .status=="completed" and .conclusion=="success"' <<< "$run_json" >/dev/null
          artifact_json=$(gh api "repos/$REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID")
          jq -e --arg sha "$SOURCE_COMMIT_SHA" --arg run_id "$SOURCE_RUN_ID" --arg artifact_id "$SOURCE_ARTIFACT_ID" '.id==($artifact_id|tonumber) and .workflow_run.id==($run_id|tonumber) and .workflow_run.head_sha==$sha and .expired==false and (.size_in_bytes|tonumber)>0 and (.digest|startswith("sha256:"))' <<< "$artifact_json" >/dev/null
          artifact_name=$(jq -r '.name' <<< "$artifact_json")
          artifact_size=$(jq -r '.size_in_bytes' <<< "$artifact_json")
          artifact_digest=$(jq -r '.digest' <<< "$artifact_json")
          asset_name="$artifact_name.zip"
          asset_path="$RUNNER_TEMP/$asset_name"
          gh api "repos/$REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" > "$asset_path"
          test "$(wc -c < "$asset_path" | tr -d ' ')" = "$artifact_size"
          test "sha256:$(sha256sum "$asset_path" | awk '{print $1}')" = "$artifact_digest"
          {
            echo "artifact_name=$artifact_name"
            echo "artifact_size=$artifact_size"
            echo "artifact_digest=$artifact_digest"
            echo "asset_name=$asset_name"
            echo "asset_path=$asset_path"
          } >> "$GITHUB_OUTPUT"

      - name: Verify immutable v0.44.0 parent by API and bytes
        shell: bash
        run: |
          set -Eeuo pipefail
          parent_release=$(gh api "repos/$REPOSITORY/releases/tags/v0.44.0")
          jq -e '.id==380386277 and .tag_name=="v0.44.0" and .html_url=="https://github.com/kimjooyoon/gooo-self-improvement-ledger/releases/tag/v0.44.0" and .target_commitish=="main" and .draft==false and .prerelease==false and .immutable==true and ([.assets[]|{id,name,size,digest,browser_download_url}]|sort_by(.id))==([{id:539347880,name:"gooo-self-improvement-ledger-35a96e54dd8457c13e45b8339a09787f806c4455.zip",size:30322448,digest:"sha256:70e995f17de551624497db95caca1da10b56f46eaa058d15bc244b88701b3d24",browser_download_url:"https://github.com/kimjooyoon/gooo-self-improvement-ledger/releases/download/v0.44.0/gooo-self-improvement-ledger-35a96e54dd8457c13e45b8339a09787f806c4455.zip"}]|sort_by(.id))' <<< "$parent_release" >/dev/null
          parent_ref=$(gh api "repos/$REPOSITORY/git/ref/tags/v0.44.0")
          jq -e '.object.sha=="a14d2bc3276ffebc689bbe61d0fe707cda42af6" and .object.type=="tag"' <<< "$parent_ref" >/dev/null
          parent_tag=$(gh api "repos/$REPOSITORY/git/tags/a14d2bc3276ffebc689bbe61d0fe707cda42af6")
          jq -e '.object.sha=="35a96e54dd8457c13e45b8339a09787f806c4455" and .object.type=="commit"' <<< "$parent_tag" >/dev/null
          gh api "repos/$REPOSITORY/releases/assets/539347880" -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/v0440-parent.zip"
          test "$(wc -c < "$RUNNER_TEMP/v0440-parent.zip" | tr -d ' ')" = 30322448
          test "sha256:$(sha256sum "$RUNNER_TEMP/v0440-parent.zip" | awk '{print $1}')" = sha256:70e995f17de551624497db95caca1da10b56f46eaa058d15bc244b88701b3d24

      - name: Preserve the v0.40.0 failed release envelope
        shell: bash
        run: |
          set -Eeuo pipefail
          jq -e '.schema=="gooo/self-improvement-ledger/release-transport-envelope/v1" and .event_type=="RELEASE_TRANSPORT_FAILURE" and .semantic_state=={total_cells:46,closed:43,unknown:1,refuted:2} and .preserved_failure=={tag:"v0.40.0",release_id:380259706,immutable:true,asset_count:0,tag_object_sha:"ca691484122c408d60b694ed7a5a9179a4a613d5",target_commit_sha:"7883b07a3ebc0101acc516a4a5662f01296c63a9",state:"REFUTED",reason:"RELEASE_PUBLISHED_BEFORE_ASSET_UPLOAD",preserved:true,mutation_policy:"NO_DELETE_NO_OVERWRITE"} and .correction.target_tag=="v0.40.1" and .correction.semantic_cell_additions==0 and .authority=={verification:"GITHUB_ACTIONS",local_go_test:0,local_go_build:0,local_go_vet:0,local_conformance:0,repository_writes:0}' evidence/release-transport-v1.json >/dev/null
          old_release=$(gh api "repos/$REPOSITORY/releases/tags/v0.40.0")
          jq -e '.id==380259706 and .tag_name=="v0.40.0" and .immutable==true and (.assets|length)==0' <<< "$old_release" >/dev/null
          old_ref=$(gh api "repos/$REPOSITORY/git/ref/tags/v0.40.0")
          jq -e '.object.sha=="ca691484122c408d60b694ed7a5a9179a4a613d5" and .object.type=="tag"' <<< "$old_ref" >/dev/null
          old_tag=$(gh api "repos/$REPOSITORY/git/tags/ca691484122c408d60b694ed7a5a9179a4a613d5")
          jq -e '.object.sha=="7883b07a3ebc0101acc516a4a5662f01296c63a9" and .object.type=="commit"' <<< "$old_tag" >/dev/null

      - name: Refuse to overwrite an existing v0.45.0 release or tag
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG" > "$RUNNER_TEMP/existing-release.json" 2>/dev/null; then exit 1; fi
          if gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" > "$RUNNER_TEMP/existing-ref.json" 2>/dev/null; then exit 1; fi

      - name: Create the annotated v0.45.0 tag
        id: tag
        shell: bash
        run: |
          set -Eeuo pipefail
          tag_json=$(gh api --method POST "repos/$REPOSITORY/git/tags" -f tag="$RELEASE_TAG" -f message="$RELEASE_TAG: immutable release transport conformer adoption" -f object="$SOURCE_COMMIT_SHA" -f type=commit)
          tag_object=$(jq -r '.sha' <<< "$tag_json")
          test -n "$tag_object" && test "$tag_object" != null
          gh api --method POST "repos/$REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$tag_object" >/dev/null
          echo "tag_object=$tag_object" >> "$GITHUB_OUTPUT"

      - name: Create the draft release before asset upload
        id: draft
        shell: bash
        run: |
          set -Eeuo pipefail
          release_body=$(cat <<EOF
          v0.45.0 adopts kimjooyoon/gooo-release-transport-conformer v0.1.3 as exactly one append-only portfolio cell.

          Upstream release 380375220 binds annotated tag object 036d3f9dcfb81511b64a34ae360ecd58b0e58fdd to target 932c98e97ca61bd4f64764a9793c3dabfd05c359. Its source, evidence, and SHA256SUMS assets, twenty-scenario CLOSED8/UNKNOWN3/REFUTED9 contract, twelve exactly-once activities, and successful source/release Actions evidence are locked in the ledger.

          Semantic state is 51 cells, 48 CLOSED, 1 UNKNOWN, and 2 REFUTED. Source is successful main CI run $SOURCE_RUN_ID, artifact $SOURCE_ARTIFACT_ID, commit $SOURCE_COMMIT_SHA. The immutable v0.44.0 parent is release 380386277 with tag object a14d2bc3276ffebc689bbe61d0fe707cda42af6 and target 35a96e54dd8457c13e45b8339a09787f806c4455.
          EOF
          )
          release_json=$(gh api --method POST "repos/$REPOSITORY/releases" -f tag_name="$RELEASE_TAG" -f target_commitish=main -f name="$RELEASE_TAG" -f body="$release_body" -F draft=true -F prerelease=false)
          release_id=$(jq -r '.id' <<< "$release_json")
          test -n "$release_id" && test "$release_id" != null
          jq -e --arg tag "$RELEASE_TAG" '.tag_name==$tag and .draft==true and .prerelease==false and (.assets|length)==0' <<< "$release_json" >/dev/null
          echo "release_id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Upload the exact main CI artifact to the draft release
        id: upload
        shell: bash
        env:
          ASSET_PATH: ${{ steps.source.outputs.asset_path }}
          ASSET_NAME: ${{ steps.source.outputs.asset_name }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        run: |
          set -Eeuo pipefail
          upload_url=$(gh api "repos/$REPOSITORY/releases/$RELEASE_ID" --jq '.upload_url')
          upload_url=${upload_url%\{*}
          upload_json=$(gh api --method POST "$upload_url?name=$ASSET_NAME" -H 'Content-Type: application/zip' --input "$ASSET_PATH")
          jq -e --arg name "$ASSET_NAME" '.name==$name and .state=="uploaded"' <<< "$upload_json" >/dev/null
          echo "asset_id=$(jq -r '.id' <<< "$upload_json")" >> "$GITHUB_OUTPUT"

      - name: Publish the populated v0.45.0 release
        env:
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          gh api --method PATCH "repos/$REPOSITORY/releases/$RELEASE_ID" -F draft=false > "$RUNNER_TEMP/published-release.json"
          jq -e '.draft==false and .prerelease==false' "$RUNNER_TEMP/published-release.json" >/dev/null

      - name: Verify immutable v0.45.0 release, tag, asset, and emit receipt
        env:
          ASSET_NAME: ${{ steps.source.outputs.asset_name }}
          ASSET_SIZE: ${{ steps.source.outputs.artifact_size }}
          ASSET_DIGEST: ${{ steps.source.outputs.artifact_digest }}
          RELEASE_ID: ${{ steps.draft.outputs.release_id }}
          TAG_OBJECT: ${{ steps.tag.outputs.tag_object }}
        shell: bash
        run: |
          set -Eeuo pipefail
          release_json=$(gh api "repos/$REPOSITORY/releases/$RELEASE_ID")
          jq -e --arg tag "$RELEASE_TAG" --arg name "$ASSET_NAME" --arg digest "$ASSET_DIGEST" --argjson size "$ASSET_SIZE" --argjson release_id "$RELEASE_ID" '.id==$release_id and .tag_name==$tag and .draft==false and .prerelease==false and .immutable==true and (.assets|length)==1 and .assets[0].name==$name and .assets[0].size==$size and .assets[0].digest==$digest' <<< "$release_json" >/dev/null
          asset_id=$(jq -r '.assets[0].id' <<< "$release_json")
          tag_ref=$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG")
          jq -e --arg object "$TAG_OBJECT" '.object.sha==$object and .object.type=="tag"' <<< "$tag_ref" >/dev/null
          tag_target=$(gh api "repos/$REPOSITORY/git/tags/$TAG_OBJECT")
          jq -e --arg commit "$SOURCE_COMMIT_SHA" '.object.sha==$commit and .object.type=="commit"' <<< "$tag_target" >/dev/null
          release_refs=$(git ls-remote "https://github.com/$REPOSITORY.git" "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
          test "$(awk -v ref="refs/tags/$RELEASE_TAG" '$2==ref {print $1}' <<< "$release_refs")" = "$TAG_OBJECT"
          test "$(awk -v ref="refs/tags/$RELEASE_TAG^{}" '$2==ref {print $1}' <<< "$release_refs")" = "$SOURCE_COMMIT_SHA"
          jq -n \
            --arg schema 'gooo/self-improvement-ledger/release-transport-receipt/v1' \
            --arg tag "$RELEASE_TAG" --argjson release_id "$RELEASE_ID" --argjson asset_id "$asset_id" \
            --arg tag_object "$TAG_OBJECT" --arg commit "$SOURCE_COMMIT_SHA" \
            --argjson source_run "$SOURCE_RUN_ID" --argjson source_artifact "$SOURCE_ARTIFACT_ID" \
            --arg asset "$ASSET_NAME" --argjson size "$ASSET_SIZE" --arg digest "$ASSET_DIGEST" \
            '{schema:$schema,correction:{tag:$tag,release_id:$release_id,immutable:true,asset_count:1,tag_object_sha:$tag_object,target_commit_sha:$commit,source_run_id:$source_run,source_artifact_id:$source_artifact,asset:{id:$asset_id,name:$asset,size_bytes:$size,digest:$digest}},parent_v044:{release_id:380386277,tag:"v0.44.0",immutable:true,asset_count:1,tag_object_sha:"a14d2bc3276ffebc689bbe61d0fe707cda42af6",target_commit_sha:"35a96e54dd8457c13e45b8339a09787f806c4455",asset:{id:539347880,name:"gooo-self-improvement-ledger-35a96e54dd8457c13e45b8339a09787f806c4455.zip",size_bytes:30322448,digest:"sha256:70e995f17de551624497db95caca1da10b56f46eaa058d15bc244b88701b3d24"},transport:{run_id:33494896036,job_id:99814686460,receipt_artifact_id:9795295120,receipt_artifact_size_bytes:994,receipt_artifact_digest:"sha256:1ee117ceffba4673402b53943481554795aa976dc33b3ba2051f8694e514dc99"}},preserved_failure:{tag:"v0.40.0",release_id:380259706,immutable:true,asset_count:0,state:"REFUTED",reason:"RELEASE_PUBLISHED_BEFORE_ASSET_UPLOAD"},semantic_state:{total_cells:51,closed:48,unknown:1,refuted:2},authority:{verification:"GITHUB_ACTIONS",local_go_test:0,local_go_build:0,local_go_vet:0,local_conformance:0,local_go_integration:0,repository_writes:0},measurement_policy:{missing_peak_rss:"null",measurement_state:"UNKNOWN",unknown_fields:["stage","step","reason","unknown_class","next_operation","blocked_by"],zero_coercion:false}}' \
            > "$RUNNER_TEMP/release-transport-receipt.json"
          cat "$RUNNER_TEMP/release-transport-receipt.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload v0.45.0 release transport receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-transport-receipt-${{ inputs.release_tag }}
          path: ${{ runner.temp }}/release-transport-receipt.json
          if-no-files-found: ignore
          retention-days: 30
