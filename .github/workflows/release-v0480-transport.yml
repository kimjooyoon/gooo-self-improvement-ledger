name: Immutable v0.48.0 atomic release transport

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful main GitHub Actions run that produced the source artifact
        required: true
        type: string
      source_artifact_id:
        description: Exact artifact ID from the successful main run
        required: true
        type: string
      source_commit_sha:
        description: Main commit checked by the source run
        required: true
        type: string
      release_tag:
        description: New immutable release tag
        required: true
        default: v0.48.0
        type: string
      resume_existing:
        description: Verify an already-created immutable release without mutation
        required: false
        default: false
        type: boolean
      resume_draft:
        description: Complete an already-created draft release without recreating its tag or release
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      SOURCE_RUN_ID: ${{ inputs.source_run_id }}
      SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
      SOURCE_COMMIT_SHA: ${{ inputs.source_commit_sha }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      RESUME_EXISTING: ${{ inputs.resume_existing }}
      RESUME_DRAFT: ${{ inputs.resume_draft }}
    steps:
      - name: Check out source commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_commit_sha }}
          fetch-depth: 1

      - name: Resolve and verify exact main evidence artifact
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RELEASE_TAG" = v0.48.0
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT_SHA"
          if test "$RESUME_EXISTING" != true && test "$RESUME_DRAFT" != true; then
            test "$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$SOURCE_COMMIT_SHA"
          fi
          run_json=$(gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID")
          jq -e --arg run "$SOURCE_RUN_ID" --arg sha "$SOURCE_COMMIT_SHA" \
            '.id==($run|tonumber) and .event=="push" and .head_branch=="main" and .head_sha==$sha and .status=="completed" and .conclusion=="success"' <<< "$run_json" >/dev/null
          artifact_json=$(gh api "repos/$REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID")
          jq -e --arg id "$SOURCE_ARTIFACT_ID" --arg run "$SOURCE_RUN_ID" --arg sha "$SOURCE_COMMIT_SHA" \
            '.id==($id|tonumber) and .workflow_run.id==($run|tonumber) and .workflow_run.head_sha==$sha and .expired==false and (.size_in_bytes|tonumber)>0 and (.digest|startswith("sha256:"))' <<< "$artifact_json" >/dev/null
          artifact_name=$(jq -r '.name' <<< "$artifact_json")
          artifact_size=$(jq -r '.size_in_bytes' <<< "$artifact_json")
          artifact_digest=$(jq -r '.digest' <<< "$artifact_json")
          source_job_id=$(gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs" | jq -er '[.jobs[]|select(.name=="evidence" and .conclusion=="success")]|if length==1 then .[0].id else error("expected one evidence job") end')
          asset_path="$RUNNER_TEMP/$artifact_name.zip"
          gh api "repos/$REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" > "$asset_path"
          test "$(wc -c < "$asset_path" | tr -d ' ')" = "$artifact_size"
          test "sha256:$(sha256sum "$asset_path" | awk '{print $1}')" = "$artifact_digest"
          extracted="$RUNNER_TEMP/v048-source-evidence"
          mkdir -p "$extracted"
          unzip -q "$asset_path" -d "$extracted"
          report_json="$extracted/report.json"
          denominator_json="$extracted/semantic-denominator-projector/semantic-denominator.json"
          assertions_json="$extracted/semantic-denominator-projector/generated-assertions.json"
          events_json="$extracted/semantic-denominator-projector/projection-events.ndjson"
          test -f "$report_json" -a -f "$denominator_json" -a -f "$assertions_json" -a -f "$events_json"
          jq -e '.summary=={total:60,closed:57,unknown:1,refuted:2} and .proof_counts=={FOUNDATION:{numerator:4,denominator:4},COHERENCE:{numerator:51,denominator:51},REGRESSION:{numerator:5,denominator:5}} and .indicator_counts=={DRIVER:{numerator:4,denominator:4},OUTCOME:{numerator:51,denominator:51},GUARDRAIL:{numerator:5,denominator:5}}' "$report_json" >/dev/null
          jq -e '.scenario_denominator==60 and .state_counts=={total:60,closed:57,unknown:1,refuted:2} and .proof_totals=={FOUNDATION:4,COHERENCE:51,REGRESSION:5} and .indicator_totals=={DRIVER:4,OUTCOME:51,GUARDRAIL:5}' "$denominator_json" >/dev/null
          jq -e '.exact_match.report_summary=={total:60,closed:57,unknown:1,refuted:2} and (.exact_match.report_cells|length)==60' "$assertions_json" >/dev/null
          test "$(jq -s length "$events_json")" = 60
          jq -e '.schema=="gooo/self-improvement-ledger/atomic-v0480-adoption-wave/v1" and .wave.projected_profile_state=={total:60,closed:57,unknown:1,refuted:2} and (.cells|length)==7 and .bounded_parallel_verifier.snapshot_single_fetch==true and .bounded_parallel_verifier.network_improvement_state=="UNKNOWN" and .authority.repository_writes==0' evidence/atomic-v0480-wave-v1.json >/dev/null
          {
            echo "artifact_name=$artifact_name"
            echo "artifact_size=$artifact_size"
            echo "artifact_digest=$artifact_digest"
            echo "source_job_id=$source_job_id"
            echo "asset_name=$artifact_name.zip"
            echo "asset_path=$asset_path"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse overwrite of existing v0.48.0 release or tag
        if: inputs.resume_existing != true && inputs.resume_draft != true
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG" >/dev/null 2>&1; then exit 1; fi
          if gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then exit 1; fi

      - name: Create annotated v0.48.0 tag
        if: inputs.resume_existing != true && inputs.resume_draft != true
        shell: bash
        run: |
          set -Eeuo pipefail
          tag_json=$(gh api --method POST "repos/$REPOSITORY/git/tags" -f tag="$RELEASE_TAG" -f message="$RELEASE_TAG: atomic seven-cell adoption wave" -f object="$SOURCE_COMMIT_SHA" -f type=commit)
          tag_object=$(jq -r '.sha' <<< "$tag_json")
          test -n "$tag_object" -a "$tag_object" != null
          gh api --method POST "repos/$REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$tag_object" >/dev/null

      - name: Create v0.48.0 draft release before upload
        if: inputs.resume_existing != true && inputs.resume_draft != true
        shell: bash
        run: |
          set -Eeuo pipefail
          body="$RELEASE_TAG is one atomic adoption wave containing seven independent CLOSED release-ownership cells (54-60). The generated profile is 60 total / 57 CLOSED / 1 UNKNOWN / 2 REFUTED, with proof FOUNDATION 4 / COHERENCE 51 / REGRESSION 5 and indicators DRIVER 4 / OUTCOME 51 / GUARDRAIL 5. The release verifier uses one bounded-parallel snapshot (bound 8, retry 3, timeout 30s), then evaluates that same snapshot sequentially and in parallel in canonical lock order; semantic equivalence is required. Live network improvement remains UNKNOWN because no matched local before/after pair exists; the scheduler's 53-lock fixture is preserved as upstream evidence only. v0.47.1 remains the CLOSED parent and v0.47.0 remains an immutable REFUTED counterexample."
          gh api --method POST "repos/$REPOSITORY/releases" -f tag_name="$RELEASE_TAG" -f target_commitish=main -f name="$RELEASE_TAG" -f body="$body" -F draft=true -F prerelease=false >/dev/null

      - name: Upload exact main evidence artifact and publish
        if: inputs.resume_existing != true
        env:
          ASSET_PATH: ${{ steps.source.outputs.asset_path }}
          ASSET_NAME: ${{ steps.source.outputs.asset_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          release_id=""
          for attempt in $(seq 1 12); do
            releases=$(gh api "repos/$REPOSITORY/releases?per_page=100")
            release_id=$(jq -r --arg tag "$RELEASE_TAG" '[.[]|select(.tag_name==$tag and .draft==true)]|if length==1 then .[0].id else empty end' <<< "$releases")
            if test -n "$release_id"; then break; fi
            sleep 5
          done
          test -n "$release_id"
          release_json=$(gh api "repos/$REPOSITORY/releases/$release_id")
          upload_url=$(jq -r '.upload_url' <<< "$release_json" | sed 's/{.*//')
          if ! jq -e --arg name "$ASSET_NAME" '[.assets[]|select(.name==$name)]|length==1' <<< "$release_json" >/dev/null; then
            gh api --method POST "$upload_url?name=$ASSET_NAME" -H 'Content-Type: application/zip' --input "$ASSET_PATH" >/dev/null
          fi
          gh api --method PATCH "repos/$REPOSITORY/releases/$release_id" -F draft=false >/dev/null

      - name: Verify immutable v0.48.0 release, public refs, and emit receipt
        env:
          ASSET_NAME: ${{ steps.source.outputs.asset_name }}
          ASSET_SIZE: ${{ steps.source.outputs.artifact_size }}
          ASSET_DIGEST: ${{ steps.source.outputs.artifact_digest }}
          SOURCE_JOB_ID: ${{ steps.source.outputs.source_job_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          release_json=""
          for attempt in $(seq 1 12); do
            if release_json=$(gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG"); then break; fi
            sleep 5
          done
          release_id=$(jq -r '.id' <<< "$release_json")
          asset_id=$(jq -r --arg name "$ASSET_NAME" '.assets[]|select(.name==$name)|.id' <<< "$release_json")
          jq -e --arg tag "$RELEASE_TAG" --arg name "$ASSET_NAME" --arg digest "$ASSET_DIGEST" --argjson size "$ASSET_SIZE" --argjson release_id "$release_id" --argjson asset_id "$asset_id" \
            '.id==$release_id and .tag_name==$tag and .draft==false and .prerelease==false and .immutable==true and (.assets|length)==1 and .assets[0].id==$asset_id and .assets[0].name==$name and .assets[0].size==$size and .assets[0].digest==$digest' <<< "$release_json" >/dev/null
          tag_ref=$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG")
          tag_object=$(jq -r '.object.sha' <<< "$tag_ref")
          jq -e '.object.type=="tag"' <<< "$tag_ref" >/dev/null
          jq -e --arg commit "$SOURCE_COMMIT_SHA" '.object.sha==$commit and .object.type=="commit"' <<< "$(gh api "repos/$REPOSITORY/git/tags/$tag_object")" >/dev/null
          refs=$(git ls-remote "https://github.com/$REPOSITORY.git" "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
          test "$(awk -v ref="refs/tags/$RELEASE_TAG" '$2==ref {print $1}' <<< "$refs")" = "$tag_object"
          test "$(awk -v ref="refs/tags/$RELEASE_TAG^{}" '$2==ref {print $1}' <<< "$refs")" = "$SOURCE_COMMIT_SHA"
          jq -n --arg tag "$RELEASE_TAG" --argjson release_id "$release_id" --argjson asset_id "$asset_id" --arg name "$ASSET_NAME" --argjson size "$ASSET_SIZE" --arg digest "$ASSET_DIGEST" --arg tag_object "$tag_object" --arg commit "$SOURCE_COMMIT_SHA" --argjson source_run "$SOURCE_RUN_ID" --argjson source_job "$SOURCE_JOB_ID" --argjson source_artifact "$SOURCE_ARTIFACT_ID" \
            '{schema:"gooo/self-improvement-ledger/release-transport-receipt/v1",release:{tag:$tag,release_id:$release_id,immutable:true,asset_count:1,asset:{id:$asset_id,name:$name,size_bytes:$size,digest:$digest},tag_object_sha:$tag_object,target_commit_sha:$commit,source_run_id:$source_run,source_job_id:$source_job,source_artifact_id:$source_artifact},semantic_state:{total_cells:60,closed:57,unknown:1,refuted:2,proof_totals:{FOUNDATION:4,COHERENCE:51,REGRESSION:5},indicator_totals:{DRIVER:4,OUTCOME:51,GUARDRAIL:5}},bounded_parallel:{concurrency_bound:8,retry_max_attempts:3,timeout_seconds:30,canonical_lock_order:"release_lock_id:ascending",snapshot_single_fetch:true,semantic_equivalence:"CLOSED",network_improvement:"UNKNOWN",network_improvement_reason:"NO_MATCHED_LIVE_BEFORE_AFTER_PAIR"},parent_v0471:{release_id:380630346,tag:"v0.47.1",immutable:true,target_commit_sha:"004edebd21d1935bfcec9d9d923292e555bc66fe",state:"CLOSED"},preserved_v0470_refuted:{release_id:380601504,tag:"v0.47.0",immutable:true,target_commit_sha:"a8104f3b22177e3bb193559e38180cbed13e5f36",state:"REFUTED",mutation_policy:"NO_DELETE_NO_OVERWRITE"},authority:{verification:"GITHUB_ACTIONS",github_token:"github.token",repository_writes:0,runtime_writes:0,cross_project_required_gates:0}}' > "$RUNNER_TEMP/release-transport-receipt.json"
          cat "$RUNNER_TEMP/release-transport-receipt.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload v0.48.0 transport receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-transport-receipt-${{ inputs.release_tag }}
          path: ${{ runner.temp }}/release-transport-receipt.json
          if-no-files-found: ignore
          retention-days: 30
