name: Publish v0.49.0 atomic adoption release

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful main evidence workflow run
        required: true
        type: string
      source_artifact_id:
        description: Exact main evidence artifact id
        required: true
        type: string
      source_commit_sha:
        description: Main commit validated by the source run
        required: true
        type: string
      release_tag:
        description: Immutable release tag
        required: true
        default: v0.49.0
        type: string
      resume_existing:
        description: Resume verification of an already published release
        required: false
        default: false
        type: boolean
      resume_draft:
        description: Resume an existing draft after a failed upload attempt
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: write

env:
  REPOSITORY: kimjooyoon/gooo-self-improvement-ledger
  SOURCE_RUN_ID: ${{ inputs.source_run_id }}
  SOURCE_ARTIFACT_ID: ${{ inputs.source_artifact_id }}
  SOURCE_COMMIT_SHA: ${{ inputs.source_commit_sha }}
  RELEASE_TAG: ${{ inputs.release_tag }}
  RESUME_EXISTING: ${{ inputs.resume_existing }}
  RESUME_DRAFT: ${{ inputs.resume_draft }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_commit_sha }}
          fetch-depth: 1

      - name: Resolve and verify exact main evidence artifact
        id: source
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$RELEASE_TAG" = v0.49.0
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT_SHA"
          if test "$RESUME_EXISTING" != true && test "$RESUME_DRAFT" != true; then
            test "$(gh api "repos/$REPOSITORY/git/ref/heads/main" --jq '.object.sha')" = "$SOURCE_COMMIT_SHA"
          fi
          run_json=$(gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID")
          jq -e --arg run "$SOURCE_RUN_ID" --arg sha "$SOURCE_COMMIT_SHA" \
            '.id==($run|tonumber) and .event=="push" and .head_branch=="main" and .head_sha==$sha and .status=="completed" and .conclusion=="success"' <<< "$run_json" >/dev/null
          artifact_json=$(gh api "repos/$REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID")
          jq -e --arg id "$SOURCE_ARTIFACT_ID" --arg run "$SOURCE_RUN_ID" --arg sha "$SOURCE_COMMIT_SHA" \
            '.id==($id|tonumber) and .workflow_run.id==($run|tonumber) and .workflow_run.head_sha==$sha and .expired==false and (.size_in_bytes|tonumber)>0 and (.digest|startswith("sha256:"))' <<< "$artifact_json" >/dev/null
          artifact_name=$(jq -r '.name' <<< "$artifact_json")
          artifact_size=$(jq -r '.size_in_bytes' <<< "$artifact_json")
          artifact_digest=$(jq -r '.digest' <<< "$artifact_json")
          source_job_id=$(gh api "repos/$REPOSITORY/actions/runs/$SOURCE_RUN_ID/jobs" | jq -er '[.jobs[]|select(.name=="evidence" and .conclusion=="success")]|if length==1 then .[0].id else error("expected one evidence job") end')
          asset_path="$RUNNER_TEMP/$artifact_name.zip"
          gh api "repos/$REPOSITORY/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" > "$asset_path"
          test "$(wc -c < "$asset_path" | tr -d ' ')" = "$artifact_size"
          test "sha256:$(sha256sum "$asset_path" | awk '{print $1}')" = "$artifact_digest"
          extracted="$RUNNER_TEMP/v049-source-evidence"
          mkdir -p "$extracted"
          unzip -q "$asset_path" -d "$extracted"
          jq -e '.summary=={total:62,closed:59,unknown:1,refuted:2} and .proof_counts=={COHERENCE:53,FOUNDATION:4,REGRESSION:5} and .indicator_counts=={DRIVER:4,GUARDRAIL:5,OUTCOME:53} and .authority.repository_writes==0' "$extracted/report.json" >/dev/null
          jq -e '.schema=="gooo/self-improvement-ledger/atomic-v0490-adoption-wave/v1" and .wave.projected_profile_state=={total:62,closed:59,unknown:1,refuted:2} and (.cells|length)==2' "$extracted/atomic-v0490-wave-v1.json" >/dev/null
          jq -e '.schema=="gooo/self-improvement-ledger/v049-product-integration/v1" and .adoption.parent_profile.lock_count==57 and .adoption.current_lock_count==59 and .adoption.baseline.selected==59 and .adoption.baseline.executed==59 and .adoption.baseline.reused==0 and .adoption.candidate.selected==2 and .adoption.candidate.executed==2 and .adoption.candidate.reused==57 and .adoption.canonical_comparison.canonical_evidence_equal==true and .adoption.measurement_receipt.semantic.decision=="CLOSED"' "$extracted/v049-products/product-integration.json" >/dev/null
          jq -e '.scenario_denominator==62 and .state_counts=={total:62,closed:59,unknown:1,refuted:2} and .proof_totals=={COHERENCE:53,FOUNDATION:4,REGRESSION:5} and .indicator_totals=={DRIVER:4,GUARDRAIL:5,OUTCOME:53}' "$extracted/semantic-denominator-projector/semantic-denominator.json" >/dev/null
          {
            echo "artifact_name=$artifact_name"
            echo "artifact_size=$artifact_size"
            echo "artifact_digest=$artifact_digest"
            echo "source_job_id=$source_job_id"
            echo "asset_path=$asset_path"
          } >> "$GITHUB_OUTPUT"

      - name: Refuse overwrite of existing v0.49.0 release or tag
        if: inputs.resume_existing != true && inputs.resume_draft != true
        shell: bash
        run: |
          set -Eeuo pipefail
          if gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG" >/dev/null 2>&1; then exit 1; fi
          if gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then exit 1; fi

      - name: Create annotated v0.49.0 tag
        if: inputs.resume_existing != true && inputs.resume_draft != true
        shell: bash
        run: |
          set -Eeuo pipefail
          tag_json=$(gh api --method POST "repos/$REPOSITORY/git/tags" -f tag="$RELEASE_TAG" -f message="$RELEASE_TAG: atomic measurement-boundary and content-addressed reuse adoption wave" -f object="$SOURCE_COMMIT_SHA" -f type=commit)
          tag_object=$(jq -r '.sha' <<< "$tag_json")
          test -n "$tag_object" -a "$tag_object" != null
          gh api --method POST "repos/$REPOSITORY/git/refs" -f ref="refs/tags/$RELEASE_TAG" -f sha="$tag_object" >/dev/null

      - name: Create v0.49.0 draft release before upload
        if: inputs.resume_existing != true && inputs.resume_draft != true
        shell: bash
        run: |
          set -Eeuo pipefail
          body="$RELEASE_TAG is one atomic adoption wave containing two independent CLOSED release-ownership cells (61-62). The generated profile is 62 total / 59 CLOSED / 1 UNKNOWN / 2 REFUTED, with proof FOUNDATION 4 / COHERENCE 53 / REGRESSION 5 and indicators DRIVER 4 / OUTCOME 53 / GUARDRAIL 5. The same main CI evidence artifact contains the released measurement-boundary projector and content-addressed proof-reuse product receipts. The proof-reuse consumer observes the v0.48 parent fixture plus two current ledger locks, and the measurement receipt records exact before/after pairs for wall_ms, peak_rss_kib, requests, bytes_read, bytes_downloaded, selected, executed, and reused. No aggregate score or whole-language improvement is claimed. Previous failed histories remain preserved under no-delete/no-overwrite policy."
          gh api --method POST "repos/$REPOSITORY/releases" -f tag_name="$RELEASE_TAG" -f target_commitish=main -f name="$RELEASE_TAG" -f body="$body" -F draft=true -F prerelease=false >/dev/null

      - name: Upload exact main evidence artifact and publish
        if: inputs.resume_existing != true
        env:
          ASSET_PATH: ${{ steps.source.outputs.asset_path }}
          ASSET_NAME: ${{ steps.source.outputs.artifact_name }}
        shell: bash
        run: |
          set -Eeuo pipefail
          release_id=""
          for attempt in $(seq 1 12); do
            releases=$(gh api "repos/$REPOSITORY/releases?per_page=100")
            release_id=$(jq -r --arg tag "$RELEASE_TAG" '[.[]|select(.tag_name==$tag and .draft==true)]|if length==1 then .[0].id else empty end' <<< "$releases")
            if test -n "$release_id"; then break; fi
            sleep 5
          done
          test -n "$release_id"
          release_json=$(gh api "repos/$REPOSITORY/releases/$release_id")
          upload_url=$(jq -r '.upload_url' <<< "$release_json" | sed 's/{.*//')
          if ! jq -e --arg name "$ASSET_NAME" '[.assets[]|select(.name==$name)]|length==1' <<< "$release_json" >/dev/null; then
            gh api --method POST "$upload_url?name=$ASSET_NAME" -H 'Content-Type: application/zip' --input "$ASSET_PATH" >/dev/null
          fi
          gh api --method PATCH "repos/$REPOSITORY/releases/$release_id" -F draft=false >/dev/null

      - name: Verify immutable v0.49.0 release, public refs, and emit receipt
        env:
          ASSET_NAME: ${{ steps.source.outputs.artifact_name }}
          ASSET_SIZE: ${{ steps.source.outputs.artifact_size }}
          ASSET_DIGEST: ${{ steps.source.outputs.artifact_digest }}
          SOURCE_JOB_ID: ${{ steps.source.outputs.source_job_id }}
        shell: bash
        run: |
          set -Eeuo pipefail
          product_json="$RUNNER_TEMP/v049-source-evidence/v049-products/product-integration.json"
          adoption_json=$(jq -c '.adoption' "$product_json")
          release_json=""
          for attempt in $(seq 1 12); do
            if release_json=$(gh api "repos/$REPOSITORY/releases/tags/$RELEASE_TAG"); then break; fi
            sleep 5
          done
          release_id=$(jq -r '.id' <<< "$release_json")
          asset_id=$(jq -r --arg name "$ASSET_NAME" '.assets[]|select(.name==$name)|.id' <<< "$release_json")
          jq -e --arg tag "$RELEASE_TAG" --arg name "$ASSET_NAME" --arg digest "$ASSET_DIGEST" --argjson size "$ASSET_SIZE" --argjson release_id "$release_id" --argjson asset_id "$asset_id" \
            '.id==$release_id and .tag_name==$tag and .draft==false and .prerelease==false and .immutable==true and (.assets|length)==1 and .assets[0].id==$asset_id and .assets[0].name==$name and .assets[0].size==$size and .assets[0].digest==$digest' <<< "$release_json" >/dev/null
          tag_ref=$(gh api "repos/$REPOSITORY/git/ref/tags/$RELEASE_TAG")
          tag_object=$(jq -r '.object.sha' <<< "$tag_ref")
          jq -e '.object.type=="tag"' <<< "$tag_ref" >/dev/null
          jq -e --arg commit "$SOURCE_COMMIT_SHA" '.object.sha==$commit and .object.type=="commit"' <<< "$(gh api "repos/$REPOSITORY/git/tags/$tag_object")" >/dev/null
          refs=$(git ls-remote "https://github.com/$REPOSITORY.git" "refs/tags/$RELEASE_TAG" "refs/tags/$RELEASE_TAG^{}")
          test "$(awk -v ref="refs/tags/$RELEASE_TAG" '$2==ref {print $1}' <<< "$refs")" = "$tag_object"
          test "$(awk -v ref="refs/tags/$RELEASE_TAG^{}" '$2==ref {print $1}' <<< "$refs")" = "$SOURCE_COMMIT_SHA"
          jq -n --arg tag "$RELEASE_TAG" --argjson release_id "$release_id" --argjson asset_id "$asset_id" --arg name "$ASSET_NAME" --argjson size "$ASSET_SIZE" --arg digest "$ASSET_DIGEST" --arg tag_object "$tag_object" --arg commit "$SOURCE_COMMIT_SHA" --argjson source_run "$SOURCE_RUN_ID" --argjson source_job "$SOURCE_JOB_ID" --argjson source_artifact "$SOURCE_ARTIFACT_ID" --argjson adoption "$adoption_json" \
            '{schema:"gooo/self-improvement-ledger/release-transport-receipt/v1",release:{tag:$tag,release_id:$release_id,immutable:true,asset_count:1,asset:{id:$asset_id,name:$name,size_bytes:$size,digest:$digest},tag_object_sha:$tag_object,target_commit_sha:$commit,source_run_id:$source_run,source_job_id:$source_job,source_artifact_id:$source_artifact},semantic_state:{total_cells:62,closed:59,unknown:1,refuted:2,proof_totals:{FOUNDATION:4,COHERENCE:53,REGRESSION:5},indicator_totals:{DRIVER:4,OUTCOME:53,GUARDRAIL:5}},adoption:{products:["kimjooyoon/gooo-measurement-boundary-projector@v0.1.1","kimjooyoon/gooo-content-addressed-proof-reuse@v0.1.2"],parent_lock_count:$adoption.parent_profile.lock_count,current_lock_count:$adoption.current_lock_count,observed_baseline:$adoption.baseline,observed_candidate:$adoption.candidate,exact_metric_vector:$adoption.measurement_receipt.metric_vector,single_receipt_chain:$adoption.measurement_receipt.single_receipt_chain.consumer_receipts_exact,report_verification_authority_same:$adoption.measurement_receipt.single_receipt_chain.report_verification_authority_same},bounded_parallel:{concurrency_bound:8,retry_max_attempts:3,timeout_seconds:30,canonical_lock_order:"release_lock_id:ascending",snapshot_single_fetch:true,semantic_equivalence:"CLOSED",network_improvement:"UNKNOWN"},preservation:{parent_v048_release_id:380694027,parent_v048_tag:"v0.48.0",failed_histories_preserved:true},authority:{verification:"GITHUB_ACTIONS",github_token:"github.token",repository_writes:0,runtime_writes:0,cross_project_required_gates:0}}' > "$RUNNER_TEMP/release-transport-receipt.json"
          cat "$RUNNER_TEMP/release-transport-receipt.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload v0.49.0 transport receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-transport-receipt-${{ inputs.release_tag }}
          path: ${{ runner.temp }}/release-transport-receipt.json
          if-no-files-found: ignore
          retention-days: 30
