name: Self-improvement portfolio evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: gooo-self-improvement-portfolio-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    env:
      SUBJECT_SHA: ${{ github.sha }}
      ARTIFACT_ROOT: /tmp/gooo-self-improvement-ledger
    steps:
      - name: Check out the reviewed subject
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SUBJECT_SHA }}
          fetch-depth: 0

      - name: Install Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: Verify reviewed subject and record clean checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(go env GOVERSION)" = go1.27.0
          mkdir -p "$ARTIFACT_ROOT"
          git status --porcelain=v1 -z --untracked-files=all | sha256sum | awk '{print $1}' > "$RUNNER_TEMP/repository-before"

      - name: Preflight v0.56 release input before evidence generation
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/verify-v0560-release-input.sh --repository "$GITHUB_WORKSPACE"

      - name: Verify formatting, vet, tests, and build in GitHub Actions
        shell: bash
        run: |
          set -Eeuo pipefail
          files=$(gofmt -l .)
          if test -n "$files"; then
            gofmt -d $files
            exit 1
          fi
          go vet ./...
          build_start=$(date +%s%N)
          /usr/bin/time -f '%M' -o "$ARTIFACT_ROOT/build-peak-rss" go build -trimpath -o "$RUNNER_TEMP/ledger-report" ./cmd/ledger-report
          build_end=$(date +%s%N)
          test_start=$(date +%s%N)
          /usr/bin/time -f '%M' -o "$ARTIFACT_ROOT/test-peak-rss" go test -json ./... > "$ARTIFACT_ROOT/go-test.json"
          test_end=$(date +%s%N)
          test_summary=$(jq -s '{event_count:length,package_count:([.[]|select(.Package!=null)|.Package]|unique|length),pass_events:([.[]|select(.Action=="pass")]|length),fail_events:([.[]|select(.Action=="fail")]|length),skip_events:([.[]|select(.Action=="skip")]|length)}' "$ARTIFACT_ROOT/go-test.json")
          jq -n \
            --arg schema "gooo/self-improvement-portfolio/ci-observations/v1" \
            --arg go_version "$(go env GOVERSION)" --arg go_version_line "$(go version)" \
            --argjson build_wall "$(( (build_end - build_start) / 1000000 ))" --argjson build_raw "$((build_end - build_start))" --argjson build_rss "$(cat "$ARTIFACT_ROOT/build-peak-rss")" \
            --argjson test_wall "$(( (test_end - test_start) / 1000000 ))" --argjson test_raw "$((test_end - test_start))" --argjson test_rss "$(cat "$ARTIFACT_ROOT/test-peak-rss")" --argjson test_summary "$test_summary" \
            '{schema:$schema,go_version:$go_version,go_version_line:$go_version_line,checks:{gofmt:{command:"gofmt -l .",status:"success"},vet:{command:"go vet ./...",status:"success"},build:{command:"go build -trimpath -o $RUNNER_TEMP/ledger-report ./cmd/ledger-report",status:"success",timing:{wall_ms:$build_wall,duration_ns:$build_raw,peak_rss_kib:$build_rss}},test:{command:"go test -json ./...",status:"success",timing:{wall_ms:$test_wall,duration_ns:$test_raw,peak_rss_kib:$test_rss},summary:$test_summary}}}' > "$ARTIFACT_ROOT/ci-observations.json"

      - name: Preserve immutable v0.55 parent receipt and product evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          bash scripts/prepare-v0560-parent-receipt.sh "$ARTIFACT_ROOT" "$GITHUB_WORKSPACE"

      - name: Verify only five changed release locks live
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          bash scripts/verify-v0560-lock-reuse.sh "$ARTIFACT_ROOT" "$GITHUB_WORKSPACE"

      - name: Verify five product adoptions, two refutations, and seven-proposal wave
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          bash scripts/verify-v0560-products.sh "$ARTIFACT_ROOT" "$GITHUB_WORKSPACE"

      - name: Generate frontier and lineage assertions from GOOO authority
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/generate-v0560-frontier-meta-assertions.sh "$ARTIFACT_ROOT" "$GITHUB_WORKSPACE"
          cp evidence/atomic-v0560-wave-v1.json "$ARTIFACT_ROOT/atomic-v0560-wave-v1.json"

      - name: Materialize runtime measurements
        shell: bash
        run: |
          set -Eeuo pipefail
          before=$(cat "$RUNNER_TEMP/repository-before")
          git status --porcelain=v1 -z --untracked-files=all | sha256sum | awk '{print $1}' > "$RUNNER_TEMP/repository-after"
          test "$before" = "$(cat "$RUNNER_TEMP/repository-after")"
          fetch=$(jq '.timing.fetch' "$ARTIFACT_ROOT/releases/verification.json")
          verify=$(jq '.timing.verify' "$ARTIFACT_ROOT/releases/verification.json")
          ci=$(cat "$ARTIFACT_ROOT/ci-observations.json")
          verify_rss=$(jq '.release_lock_snapshot.changed_live.parallel_live_metrics.peak_rss_kib // .timing.verify.peak_rss_kib // 0' "$ARTIFACT_ROOT/releases/verification.json")
          jq -n \
            --arg schema "gooo/self-improvement-portfolio/runtime/v1" --arg subject "$SUBJECT_SHA" --arg go_version "$(go env GOVERSION)" \
            --argjson fetch "$fetch" --argjson verify "$verify" --argjson verify_rss "$verify_rss" --argjson ci "$ci" \
            '{schema:$schema,subject_sha:$subject,go_version:$go_version,timing:{fetch:$fetch,verify:($verify|.peak_rss_kib=$verify_rss),report:{wall_ms:0,duration_ns:0,peak_rss_kib:null,measurement_state:{state:"UNKNOWN",stage:"CONFORMANCE",step:"CAPTURE_REPORT_PEAK_RSS",reason:"REPORT_PEAK_RSS_MEASUREMENT_UNAVAILABLE",unknown_class:"MEASUREMENT_MISSING",next_operation:"RECAPTURE_REPORT_PEAK_RSS_IN_GITHUB_ACTIONS",blocked_by:["report-peak-rss"]}}},ci_observations:$ci,authority:{runtime_repository_writes:0,caller_owned_temp_output:true,cross_project_required_gates:0},local_execution_counts:{gofmt:0,build:0,test:0,vet:0,conformance:0}}' > "$ARTIFACT_ROOT/runtime.json"

      - name: Run fixed-denominator v0.56 conformance and emit report
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/conformance.sh "$RUNNER_TEMP/ledger-report" "$GITHUB_WORKSPACE" "$ARTIFACT_ROOT"
          final_before=$(cat "$RUNNER_TEMP/repository-after")
          git status --porcelain=v1 -z --untracked-files=all | sha256sum | awk '{print $1}' > "$RUNNER_TEMP/repository-final"
          test "$final_before" = "$(cat "$RUNNER_TEMP/repository-final")"
          jq -e '.repository_writes==0 and .summary=={total:88,closed:83,unknown:1,refuted:4}' "$ARTIFACT_ROOT/conformance.json" >/dev/null
          cat "$ARTIFACT_ROOT/ci-observations.json" >> "$GITHUB_STEP_SUMMARY"
          cat "$ARTIFACT_ROOT/report.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$ARTIFACT_ROOT/conformance.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Final v0.56 release input preflight after artifact materialization
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/verify-v0560-release-input.sh --artifact "$ARTIFACT_ROOT"

      - name: Upload human-readable evidence
        if: always()
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: gooo-self-improvement-ledger-${{ env.SUBJECT_SHA }}
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: error
          retention-days: 30

      - name: Record artifact identity
        if: always()
        run: |
          {
            echo "### Evidence artifact"
            echo "artifact_id: ${{ steps.evidence.outputs.artifact-id }}"
            echo "artifact_digest: ${{ steps.evidence.outputs.artifact-digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
