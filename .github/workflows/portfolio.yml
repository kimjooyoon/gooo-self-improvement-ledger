          test "$(wc -c < "$durable_envelope_dir/source-v0.1.9.tar.gz" | tr -d ' ')" = 30885
          test "$(sha256sum "$durable_envelope_dir/evidence-v0.1.9.tar.gz" | awk '{print $1}')" = 79b549e7471f983e1f3a9f8f19ff73b5c759bac532ad86d8c3d2738885223f6d
          test "$(sha256sum "$durable_envelope_dir/manifest-v0.1.9.json" | awk '{print $1}')" = a1352aa6cdeeefc0112884673ce672e920033b6d13d7d8e69ffbf270632df2e1
          test "$(sha256sum "$durable_envelope_dir/SHA256SUMS" | awk '{print $1}')" = efb3cebd7bcdf2dcc1a1a2279817be1286def7e7387b33f2afc505b3eb7129c6
          test "$(sha256sum "$durable_envelope_dir/source-v0.1.9.tar.gz" | awk '{print $1}')" = e33609eee44163d3201d125900d57ea12f183ebb561522e86e930d7f3805338f
          test "$(cat "$durable_envelope_dir/SHA256SUMS")" = $'79b549e7471f983e1f3a9f8f19ff73b5c759bac532ad86d8c3d2738885223f6d  evidence-v0.1.9.tar.gz\na1352aa6cdeeefc0112884673ce672e920033b6d13d7d8e69ffbf270632df2e1  manifest-v0.1.9.json\ne33609eee44163d3201d125900d57ea12f183ebb561522e86e930d7f3805338f  source-v0.1.9.tar.gz'
