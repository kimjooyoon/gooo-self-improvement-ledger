          durable_envelope_unpacked="$RUNNER_TEMP/opentofu-envelope-artifact-9773097414"
          mkdir -p "$durable_envelope_unpacked"
          unzip -q "$durable_envelope_artifact" -d "$durable_envelope_unpacked"
          jq -e '
            .schema=="gooo/opentofu-envelope/observation/v2" and .state=="CLOSED" and
            .semantic_authority.state=="CLOSED" and .utility.state=="UNKNOWN" and
            .authority.repository_writes==0 and .authority.local_test_executions==0 and .authority.opentofu_validate_executions==1 and
            .test_counts=={total:9,executed:9,reused:0,skipped:0,not_observed:0} and
            .repository_inventory=={file_count:15,go_files:0,go_physical_lines:0,gooo_files:1,gooo_physical_lines:39,physical_line_count:2401,subfolder_count:7} and
            .verification_stages==[{cache_state:"DISABLED",count:2,executed_test_count:0,execution_state:"EXECUTED",not_observed_test_count:0,peak_rss_kib:21524,prior_test_evidence_reuse_state:"NOT_REUSED",reused_test_evidence_count:0,runner_persistence:"EPHEMERAL",skipped_test_count:0,stage:"build",wall_ms:214},{cache_state:"DISABLED",count:9,executed_test_count:9,execution_state:"EXECUTED",not_observed_test_count:0,peak_rss_kib:21652,prior_test_evidence_reuse_state:"NOT_REUSED",reused_test_evidence_count:0,runner_persistence:"EPHEMERAL",skipped_test_count:0,stage:"test",wall_ms:45},{cache_state:"DISABLED",count:4,executed_test_count:0,execution_state:"EXECUTED",not_observed_test_count:0,peak_rss_kib:76084,prior_test_evidence_reuse_state:"NOT_REUSED",reused_test_evidence_count:0,runner_persistence:"EPHEMERAL",skipped_test_count:0,stage:"conformance",wall_ms:324}] and
            .generated_outputs.file_count==3 and .generated_outputs.bytes==8118 and
            .replay.comparison_count==2 and (.replay.comparisons|length)==2 and all(.replay.comparisons[]; .byte_equal==true and .first_sha256==.second_sha256) and
            .validation.official_opentofu.valid==true and .validation.official_opentofu.error_count==0 and .validation.official_opentofu.warning_count==0
          ' "$durable_envelope_unpacked/observation.json" >/dev/null

      - name: Verify separate seventeen-entry non-completeness capability evidence registry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          bash scripts/verify-capability-evidence-registry.sh \
            contracts/non-completeness-capability-evidence-registry-v1.json \
            evidence/non-completeness-capability-evidence-registry-v1.json \
            "$ARTIFACT_ROOT/capability-registry"
          jq -e '.entry_count==17 and .summary=={closed:13,unknown:0,refuted:4} and (has("percentage")|not) and (has("score")|not)' \
            "$ARTIFACT_ROOT/capability-registry/verification.json" >/dev/null

      - name: Materialize runtime measurements
        shell: bash
        run: |
          set -Eeuo pipefail
          before=$(cat "$RUNNER_TEMP/repository-before")
          git status --porcelain=v1 -z --untracked-files=all | sha256sum | awk '{print $1}' > "$RUNNER_TEMP/repository-after"
          test "$before" = "$(cat "$RUNNER_TEMP/repository-after")"
          fetch=$(jq '.timing.fetch' "$ARTIFACT_ROOT/releases/verification.json")
          verify=$(jq '.timing.verify' "$ARTIFACT_ROOT/releases/verification.json")
          ci=$(cat "$ARTIFACT_ROOT/ci-observations.json")
          verify_rss=$(cat "$ARTIFACT_ROOT/release-verify-peak-rss")
          jq -n \
            --arg schema "gooo/self-improvement-portfolio/runtime/v1" \
            --arg subject "$SUBJECT_SHA" --arg go_version "$(go env GOVERSION)" \
            --argjson fetch "$fetch" --argjson verify "$verify" --argjson verify_rss "$verify_rss" --argjson ci "$ci" \
            '{schema:$schema,subject_sha:$subject,go_version:$go_version,timing:{fetch:$fetch,verify:($verify|.peak_rss_kib=$verify_rss),report:{wall_ms:0,duration_ns:0,peak_rss_kib:0}},ci_observations:$ci,authority:{runtime_repository_writes:0,caller_owned_temp_output:true,cross_project_required_gates:0},local_execution_counts:{gofmt:0,build:0,test:0,vet:0,conformance:0}}' \
            > "$ARTIFACT_ROOT/runtime.json"

      - name: Run fixed-denominator conformance and emit human report
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/conformance.sh "$RUNNER_TEMP/ledger-report" "$GITHUB_WORKSPACE" "$ARTIFACT_ROOT"
          final_before=$(cat "$RUNNER_TEMP/repository-after")
          git status --porcelain=v1 -z --untracked-files=all | sha256sum | awk '{print $1}' > "$RUNNER_TEMP/repository-final"
          test "$final_before" = "$(cat "$RUNNER_TEMP/repository-final")"
          jq -e '.repository_writes==0 and .summary=={total:31,closed:28,unknown:1,refuted:2}' "$ARTIFACT_ROOT/conformance.json" >/dev/null
          cat "$ARTIFACT_ROOT/ci-observations.json" >> "$GITHUB_STEP_SUMMARY"
          cat "$ARTIFACT_ROOT/report.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$ARTIFACT_ROOT/conformance.json" >> "$GITHUB_STEP_SUMMARY"
          cat "$ARTIFACT_ROOT/capability-registry/verification.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload human-readable evidence
        if: always()
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: gooo-self-improvement-ledger-${{ env.SUBJECT_SHA }}
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: error
          retention-days: 30

      - name: Record artifact identity
        if: always()
        run: |
          {
            echo "### Evidence artifact"
            echo "artifact_id: ${{ steps.evidence.outputs.artifact-id }}"
            echo "artifact_digest: ${{ steps.evidence.outputs.artifact-digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
