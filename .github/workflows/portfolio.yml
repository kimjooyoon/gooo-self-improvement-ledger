name: Self-improvement portfolio evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'agent/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    env:
      SUBJECT_SHA: ${{ github.sha }}
      ARTIFACT_ROOT: /tmp/gooo-self-improvement-ledger
    steps:
      - name: Check out the reviewed subject
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SUBJECT_SHA }}

      - name: Install Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: Verify toolchain and clean checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(go env GOVERSION)" = go1.27.0
          mkdir -p "$ARTIFACT_ROOT"
          git status --porcelain=v1 -z --untracked-files=all | sha256sum | awk '{print $1}' > "$RUNNER_TEMP/repository-before"

      - name: Verify formatting, vet, tests, and build in CI
        shell: bash
        run: |
          set -Eeuo pipefail
          files=$(gofmt -l .)
          if test -n "$files"; then
            gofmt -d $files
            exit 1
          fi
          go vet ./...
          build_start=$(date +%s%N)
          /usr/bin/time -f '%M' -o "$ARTIFACT_ROOT/build-peak-rss" \
            go build -trimpath -o "$RUNNER_TEMP/ledger-report" ./cmd/ledger-report
          build_end=$(date +%s%N)
          test_start=$(date +%s%N)
          /usr/bin/time -f '%M' -o "$ARTIFACT_ROOT/test-peak-rss" \
            go test -json ./... > "$ARTIFACT_ROOT/go-test.json"
          test_end=$(date +%s%N)
          test_summary=$(jq -s '{event_count:length,package_count:([.[]|select(.Package!=null)|.Package]|unique|length),pass_events:([.[]|select(.Action=="pass")]|length),fail_events:([.[]|select(.Action=="fail")]|length),skip_events:([.[]|select(.Action=="skip")]|length)}' "$ARTIFACT_ROOT/go-test.json")
          jq -n \
            --arg schema "gooo/self-improvement-portfolio/ci-observations/v1" \
            --arg go_version "$(go env GOVERSION)" --arg go_version_line "$(go version)" \
            --argjson build_wall "$(( (build_end - build_start) / 1000000 ))" \
            --argjson build_raw "$((build_end - build_start))" \
            --argjson build_rss "$(cat "$ARTIFACT_ROOT/build-peak-rss")" \
            --argjson test_wall "$(( (test_end - test_start) / 1000000 ))" \
            --argjson test_raw "$((test_end - test_start))" \
            --argjson test_rss "$(cat "$ARTIFACT_ROOT/test-peak-rss")" \
            --argjson test_summary "$test_summary" \
            '{schema:$schema,go_version:$go_version,go_version_line:$go_version_line,checks:{gofmt:{command:"gofmt -l .",status:"success"},vet:{command:"go vet ./...",status:"success"},build:{command:"go build -trimpath -o $RUNNER_TEMP/ledger-report ./cmd/ledger-report",status:"success",timing:{wall_ms:$build_wall,duration_ns:$build_raw,peak_rss_kib:$build_rss}},test:{command:"go test -json ./...",status:"success",timing:{wall_ms:$test_wall,duration_ns:$test_raw,peak_rss_kib:$test_rss},summary:$test_summary}}}' \
            > "$ARTIFACT_ROOT/ci-observations.json"

      - name: Fetch and verify twenty-eight immutable release locks plus preserved counterexamples and failed release triggers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          /usr/bin/time -f '%M' -o "$ARTIFACT_ROOT/release-verify-peak-rss" \
          bash scripts/verify-releases.sh contracts/release-locks-v1.json "$ARTIFACT_ROOT/releases"
          jq -e '.summary=={total:28,verified:28,unknown:0,refuted:0} and (.counterexamples|length)==8 and all(.counterexamples[]; .state=="REFUTED" and .verified==true) and (.counterexample_runs|length)==8 and all(.counterexample_runs[]; .verified==true and .conclusion=="failure") and (.failed_release_triggers|length)==1 and all(.failed_release_triggers[]; .state=="REFUTED" and .verified==true and .release_absent==true and .reason=="FAILED_RELEASE_TRIGGER")' \
            "$ARTIFACT_ROOT/releases/verification.json" >/dev/null
          experience_dir="$ARTIFACT_ROOT/releases/experience_memory_release/assets"
          jq -e '.schema=="gooo/experience-memory/release-manifest/v1" and .tag=="v0.1.0" and .commit_sha=="79fd6edc588ea26279dbe735e5f6e250132f7730" and .immutable==true and .assets==[{digest:"sha256:177f7c872d4e704f5eba6dd96c43e28bfcab2a714b032188c511f3e7872e5d6d",kind:"source",name:"gooo-experience-memory-v0.1.0.tar.gz"},{digest:"sha256:27afa525ccaa5ebdf738fef99615998b51bed85d865ccd6e9367036a46a961f6",kind:"ci-evidence",name:"gooo-experience-memory-evidence-v0.1.0.tar.gz"}]' "$experience_dir/release-manifest.json" >/dev/null
          test "$(awk 'NF {print NF}' "$experience_dir/SHA256SUMS" | sort -u)" = 2
          while read -r declared_digest asset_name; do
            test "$asset_name" = "gooo-experience-memory-v0.1.0.tar.gz" || test "$asset_name" = "gooo-experience-memory-evidence-v0.1.0.tar.gz"
            actual="sha256:$(sha256sum "$experience_dir/$asset_name" | awk '{print $1}')"
            test "${declared_digest#sha256:}" = "${actual#sha256:}"
          done < <(awk '{print $1" "$2}' "$experience_dir/SHA256SUMS")
          drift_dir="$ARTIFACT_ROOT/releases/semantic_drift_guard_release/assets"
          test "$(stat -c '%s' "$drift_dir/evidence-v0.1.1.tar.gz")" = 6651
          test "$(stat -c '%s' "$drift_dir/evidence-v0.1.1.tar.gz.sha256")" = 113
          test "$(sha256sum "$drift_dir/evidence-v0.1.1.tar.gz" | awk '{print $1}')" = 83ea0adf7b59b08147eb24ef16483682d8f21d204dc93ed337d39900ae9e09ec
          test "$(sha256sum "$drift_dir/evidence-v0.1.1.tar.gz.sha256" | awk '{print $1}')" = 61e49e62af005dff6a27f43bf20be43d257095bee1b552ab89a433fbe5db111b
          test "$(awk 'NF {print NF}' "$drift_dir/evidence-v0.1.1.tar.gz.sha256" | sort -u)" = 2
          declared=$(awk 'NF {print $1}' "$drift_dir/evidence-v0.1.1.tar.gz.sha256")
          test "${declared#sha256:}" = 83ea0adf7b59b08147eb24ef16483682d8f21d204dc93ed337d39900ae9e09ec
          census_dir="$ARTIFACT_ROOT/releases/semantic_authority_census_release/assets"
          jq -e '.schema=="gooo/semantic-authority-release/v1" and .tag=="v0.1.0" and .tag_object=="c81ff9b843dce716c57fe2ab542bde52e922ab2b" and .target=="0451a1f5813e51a2d09145d7516170c7802f9fd5" and .run_id=="33421919840" and .assets=={source:"sha256:3bd78b1b7cb5330dc901003b2d23abee9b95abfe23d1ad0d754d1bdb63471866",evidence:"sha256:e68c93214ef99e65ffd818bf384668c34e8332aa7b4481d6cc70b747afaaf0e3"}' "$census_dir/manifest-v0.1.0.json" >/dev/null
          test "$(awk 'NF {print NF}' "$census_dir/SHA256SUMS" | sort -u)" = 2
          test "$(sha256sum "$census_dir/SHA256SUMS" | awk '{print $1}')" = 9ae4216b45722c43f62720a3e3d13048905e3291d7ee595d3fe6ab0f78f11411
          test "$(sha256sum "$census_dir/manifest-v0.1.0.json" | awk '{print $1}')" = 9c403c7b607c91f1cddced37611875544f047899610be293c96b6475b269b260
          test "$(sha256sum "$census_dir/source-v0.1.0.tar.gz" | awk '{print $1}')" = 3bd78b1b7cb5330dc901003b2d23abee9b95abfe23d1ad0d754d1bdb63471866
          test "$(sha256sum "$census_dir/evidence-v0.1.0.tar.gz" | awk '{print $1}')" = e68c93214ef99e65ffd818bf384668c34e8332aa7b4481d6cc70b747afaaf0e3
          while read -r declared_digest asset_name; do
            test "$asset_name" = "source-v0.1.0.tar.gz" || test "$asset_name" = "evidence-v0.1.0.tar.gz" || test "$asset_name" = "manifest-v0.1.0.json"
            test "$(sha256sum "$census_dir/$asset_name" | awk '{print $1}')" = "$declared_digest"
          done < <(awk '{print $1" "$2}' "$census_dir/SHA256SUMS")
          learning_dir="$ARTIFACT_ROOT/releases/reflexive_learning_drift_cycle_release/assets"
          jq -e '.schema=="gooo/reflexive-loop/release-manifest/v1" and .version=="v0.4.0" and .repository=="kimjooyoon/gooo-reflexive-loop" and .release=={tag:"v0.4.0",target_commit_sha:"134d9043e8808147ed2f7252527e809d3eafad44",annotated:true,immutable_required:true} and .implementation=={pull_request:7,correction_pull_request:8,merged_main_commit:"134d9043e8808147ed2f7252527e809d3eafad44"} and .workflow.run_id==33420406673 and .workflow.job_id==99581097777 and .workflow.branch=="main" and .workflow.go_version=="go1.27.0" and .workflow.conformance=="passed" and .evidence_artifact=={name:"gooo-reflexive-loop-evidence",id:9768699219,size_bytes:3624947,digest:"sha256:11f3fffb4c6ee93307e46b5c1fdb8013fe5829983e069d823d896dc77e84a6c2"} and .assets=={source:{name:"gooo-reflexive-loop-v0.4.0-source.tar.gz",size_bytes:96363,digest:"sha256:fc8f5e551bb335d0a9133623c2fdc4549f634a93645b41b8fbb7c0acc98ab957"},evidence:{name:"gooo-reflexive-loop-v0.4.0-evidence.tar.gz",size_bytes:2468418,digest:"sha256:1bac0c50f4508922b5351df3a541f4daa115c60867ca106d11d4593e7c58b5ce"}} and .evidence.schema=="gooo/reflexive-loop/learning-drift-gated/conformance/v1" and .evidence.version=="v0.4.0" and .evidence.scenario_counts=={CLOSED:3,REFUTED:5,UNKNOWN:4} and .evidence.denominator=={cells:12,fixed:true} and .evidence.precedence==["REFUTED","UNKNOWN","CLOSED"] and .evidence.normal.normal_report_digest=="sha256:c1c8686b4e9c96acfe665ead2fd176b2314642f93de428039b0b4a32a59bd6fd" and .evidence.normal.decision=="CLOSED" and .evidence.normal.repository_unchanged==true and .evidence.normal.external_utility_state=="UNKNOWN" and .evidence.authority=={repository_writes:0,pull_request_authorized:false,push_authorized:false,commit_authorized:false,merge_authorized:false,apply_authorized:false,local_test_executions:0,cross_project_required_gates:0} and .evidence.utility_inference==false' "$learning_dir/gooo-reflexive-loop-v0.4.0-manifest.json" >/dev/null
