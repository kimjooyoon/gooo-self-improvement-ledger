name: Self-improvement portfolio evidence

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'agent/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evidence:
    runs-on: ubuntu-latest
    env:
      SUBJECT_SHA: ${{ github.sha }}
      ARTIFACT_ROOT: /tmp/gooo-self-improvement-ledger
    steps:
      - name: Check out the reviewed subject
        uses: actions/checkout@v5
        with:
          ref: ${{ env.SUBJECT_SHA }}

      - name: Install Go 1.27
        uses: actions/setup-go@v6
        with:
          go-version: '1.27.0'
          cache: false

      - name: Verify toolchain and clean checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$SUBJECT_SHA"
          test "$(go env GOVERSION)" = go1.27.0
          mkdir -p "$ARTIFACT_ROOT"
          git status --porcelain=v1 -z --untracked-files=all | sha256sum | awk '{print $1}' > "$RUNNER_TEMP/repository-before"

      - name: Verify formatting, vet, tests, and build in CI
        shell: bash
        run: |
          set -Eeuo pipefail
          files=$(gofmt -l .)
          if test -n "$files"; then
            gofmt -d $files
            exit 1
          fi
          go vet ./...
          build_start=$(date +%s%N)
          /usr/bin/time -f '%M' -o "$ARTIFACT_ROOT/build-peak-rss" \
            go build -trimpath -o "$RUNNER_TEMP/ledger-report" ./cmd/ledger-report
          build_end=$(date +%s%N)
          test_start=$(date +%s%N)
          /usr/bin/time -f '%M' -o "$ARTIFACT_ROOT/test-peak-rss" \
            go test -json ./... > "$ARTIFACT_ROOT/go-test.json"
          test_end=$(date +%s%N)
          test_summary=$(jq -s '{event_count:length,package_count:([.[]|select(.Package!=null)|.Package]|unique|length),pass_events:([.[]|select(.Action=="pass")]|length),fail_events:([.[]|select(.Action=="fail")]|length),skip_events:([.[]|select(.Action=="skip")]|length)}' "$ARTIFACT_ROOT/go-test.json")
          jq -n \
            --arg schema "gooo/self-improvement-portfolio/ci-observations/v1" \
            --arg go_version "$(go env GOVERSION)" --arg go_version_line "$(go version)" \
            --argjson build_wall "$(( (build_end - build_start) / 1000000 ))" \
            --argjson build_raw "$((build_end - build_start))" \
            --argjson build_rss "$(cat "$ARTIFACT_ROOT/build-peak-rss")" \
            --argjson test_wall "$(( (test_end - test_start) / 1000000 ))" \
            --argjson test_raw "$((test_end - test_start))" \
            --argjson test_rss "$(cat "$ARTIFACT_ROOT/test-peak-rss")" \
            --argjson test_summary "$test_summary" \
            '{schema:$schema,go_version:$go_version,go_version_line:$go_version_line,checks:{gofmt:{command:"gofmt -l .",status:"success"},vet:{command:"go vet ./...",status:"success"},build:{command:"go build -trimpath -o $RUNNER_TEMP/ledger-report ./cmd/ledger-report",status:"success",timing:{wall_ms:$build_wall,duration_ns:$build_raw,peak_rss_kib:$build_rss}},test:{command:"go test -json ./...",status:"success",timing:{wall_ms:$test_wall,duration_ns:$test_raw,peak_rss_kib:$test_rss},summary:$test_summary}}}' \
            > "$ARTIFACT_ROOT/ci-observations.json"

      - name: Fetch and verify twenty-two immutable release locks plus preserved counterexamples and failed release triggers
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          /usr/bin/time -f '%M' -o "$ARTIFACT_ROOT/release-verify-peak-rss" \
          bash scripts/verify-releases.sh contracts/release-locks-v1.json "$ARTIFACT_ROOT/releases"
          jq -e '.summary=={total:22,verified:22,unknown:0,refuted:0} and (.counterexamples|length)==8 and all(.counterexamples[]; .state=="REFUTED" and .verified==true) and (.counterexample_runs|length)==8 and all(.counterexample_runs[]; .verified==true and .conclusion=="failure") and (.failed_release_triggers|length)==1 and all(.failed_release_triggers[]; .state=="REFUTED" and .verified==true and .release_absent==true and .reason=="FAILED_RELEASE_TRIGGER")' \
            "$ARTIFACT_ROOT/releases/verification.json" >/dev/null
          experience_dir="$ARTIFACT_ROOT/releases/experience_memory_release/assets"
          jq -e '.schema=="gooo/experience-memory/release-manifest/v1" and .tag=="v0.1.0" and .commit_sha=="79fd6edc588ea26279dbe735e5f6e250132f7730" and .immutable==true and .assets=={source:"sha256:177f7c872d4e704f5eba6dd96c43e28bfcab2a714b032188c511f3e7872e5d6d",evidence:"sha256:27afa525ccaa5ebdf738fef99615998b51bed85d865ccd6e9367036a46a961f6"}' "$experience_dir/release-manifest.json" >/dev/null
          test "$(awk 'NF {print NF}' "$experience_dir/SHA256SUMS" | sort -u)" = 2
          while read -r declared_digest asset_name; do
            test "$asset_name" = "gooo-experience-memory-v0.1.0.tar.gz" || test "$asset_name" = "gooo-experience-memory-evidence-v0.1.0.tar.gz"
            actual="sha256:$(sha256sum "$experience_dir/$asset_name" | awk '{print $1}')"
            test "${declared_digest#sha256:}" = "${actual#sha256:}"
          done < <(awk '{print $1" "$2}' "$experience_dir/SHA256SUMS")

      - name: Verify separate seventeen-entry non-completeness capability evidence registry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          bash scripts/verify-capability-evidence-registry.sh \
            contracts/non-completeness-capability-evidence-registry-v1.json \
            evidence/non-completeness-capability-evidence-registry-v1.json \
            "$ARTIFACT_ROOT/capability-registry"
          jq -e '.entry_count==17 and .summary=={closed:13,unknown:0,refuted:4} and (has("percentage")|not) and (has("score")|not)' \
            "$ARTIFACT_ROOT/capability-registry/verification.json" >/dev/null

      - name: Materialize runtime measurements
        shell: bash
        run: |
          set -Eeuo pipefail
          before=$(cat "$RUNNER_TEMP/repository-before")
          git status --porcelain=v1 -z --untracked-files=all | sha256sum | awk '{print $1}' > "$RUNNER_TEMP/repository-after"
          test "$before" = "$(cat "$RUNNER_TEMP/repository-after")"
          fetch=$(jq '.timing.fetch' "$ARTIFACT_ROOT/releases/verification.json")
          verify=$(jq '.timing.verify' "$ARTIFACT_ROOT/releases/verification.json")
          ci=$(cat "$ARTIFACT_ROOT/ci-observations.json")
          verify_rss=$(cat "$ARTIFACT_ROOT/release-verify-peak-rss")
          jq -n \
            --arg schema "gooo/self-improvement-portfolio/runtime/v1" \
            --arg subject "$SUBJECT_SHA" --arg go_version "$(go env GOVERSION)" \
            --argjson fetch "$fetch" --argjson verify "$verify" --argjson verify_rss "$verify_rss" --argjson ci "$ci" \
            '{schema:$schema,subject_sha:$subject,go_version:$go_version,timing:{fetch:$fetch,verify:($verify|.peak_rss_kib=$verify_rss),report:{wall_ms:0,duration_ns:0,peak_rss_kib:0}},ci_observations:$ci,authority:{runtime_repository_writes:0,caller_owned_temp_output:true,cross_project_required_gates:0},local_execution_counts:{gofmt:0,build:0,test:0,vet:0,conformance:0}}' \
            > "$ARTIFACT_ROOT/runtime.json"

      - name: Run fixed-denominator conformance and emit human report
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/conformance.sh "$RUNNER_TEMP/ledger-report" "$GITHUB_WORKSPACE" "$ARTIFACT_ROOT"
          final_before=$(cat "$RUNNER_TEMP/repository-after")
          git status --porcelain=v1 -z --untracked-files=all | sha256sum | awk '{print $1}' > "$RUNNER_TEMP/repository-final"
          test "$final_before" = "$(cat "$RUNNER_TEMP/repository-final")"
          jq -e '.repository_writes==0 and .summary=={total:25,closed:22,unknown:1,refuted:2}' "$ARTIFACT_ROOT/conformance.json" >/dev/null
          cat "$ARTIFACT_ROOT/ci-observations.json" >> "$GITHUB_STEP_SUMMARY"
          cat "$ARTIFACT_ROOT/report.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$ARTIFACT_ROOT/conformance.json" >> "$GITHUB_STEP_SUMMARY"
          cat "$ARTIFACT_ROOT/capability-registry/verification.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload human-readable evidence
        if: always()
        id: evidence
        uses: actions/upload-artifact@v4
        with:
          name: gooo-self-improvement-ledger-${{ env.SUBJECT_SHA }}
          path: ${{ env.ARTIFACT_ROOT }}
          if-no-files-found: error
          retention-days: 30

      - name: Record artifact identity
        if: always()
        run: |
          {
            echo "### Evidence artifact"
            echo "artifact_id: ${{ steps.evidence.outputs.artifact-id }}"
            echo "artifact_digest: ${{ steps.evidence.outputs.artifact-digest }}"
          } >> "$GITHUB_STEP_SUMMARY"
